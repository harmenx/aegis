name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks that need no Unity licence.
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    outputs:
      unity: ${{ steps.licence.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      - name: Every asset has a .meta file
        run: |
          missing=0
          while IFS= read -r -d '' path; do
            if [ ! -f "$path.meta" ]; then
              echo "::error file=$path::missing $path.meta"
              missing=1
            fi
          done < <(find Assets -mindepth 1 ! -name '*.meta' -print0)
          while IFS= read -r -d '' meta; do
            if [ ! -e "${meta%.meta}" ]; then
              echo "::error file=$meta::orphaned meta file"
              missing=1
            fi
          done < <(find Assets -name '*.meta' -print0)
          exit $missing

      - name: JSON files parse
        run: |
          for file in points.sample.json aegis.config.sample.json Packages/manifest.json $(find Assets -name '*.asmdef'); do
            python3 -m json.tool "$file" > /dev/null || { echo "::error file=$file::invalid JSON"; exit 1; }
          done

      - name: Unity licence configured
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE is not set, so Unity tests and builds are skipped. See README > Continuous integration."
          fi

  test:
    name: EditMode tests
    needs: repo
    if: needs.repo.outputs.unity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: Library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [StandaloneWindows64, StandaloneLinux64, StandaloneOSX]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}
          restore-keys: Library-${{ matrix.target }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildName: Aegis

      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-${{ matrix.target }}
          path: build/${{ matrix.target }}
          retention-days: 14
